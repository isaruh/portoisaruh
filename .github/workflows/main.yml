on:
  push:
    branches:  
      - master

jobs:
  build:
    name: build app
    runs-on: ubuntu-latest
    steps:
      - name: menampilkan teks
        run: |
          echo "ini step build"
  test:
    name: test app
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: menampilkan teks
        run: |
          echo "ini step test"
  deployment:
    name: deploy app
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: menampilkan teks
        run: |
          echo "ini step deployment"
      - name: Execute remote SSH commands using SSH key
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.KEY }}r
          port: ${{ secrets.PORT }}
          script: |
            rm -rf /var/www/html/*
            git clone https://github.com/isaruh/portoisaruh /var/www/html/
